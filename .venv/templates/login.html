<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - DR Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{ font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial; background:#f6f8fb; margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh}
    .container{ width:100%; max-width:420px; padding:28px }
    .card{ background:#fff; border-radius:12px; padding:26px; box-shadow:0 10px 30px rgba(3,32,63,0.07) }
    h1{ margin:0 0 8px; font-size:28px }
    p.lead{ color:#667085; margin-top:0; margin-bottom:18px }
    label{ display:block; font-weight:600; margin-bottom:6px }
    input{ width:100%; padding:12px; border:1px solid #e6e9ef; border-radius:10px; margin-bottom:14px; font-size:15px }
    .btn{ width:100%; padding:12px; border-radius:10px; background:linear-gradient(90deg,#0ea5ff,#0066cc); color:#fff; border:none; font-weight:700; cursor:pointer }
    .small-line{ text-align:center; margin-top:14px; color:#667085; font-size:14px }
    .small-line a{ color:#0066cc; font-weight:700; text-decoration:none; margin-left:6px }
    .flash{ padding:10px; border-radius:8px; margin-bottom:12px; font-weight:600 }
    .flash-success{ background:#e9fbf1; color:#1b8750 }
    .flash-danger{ background:#fff0f2; color:#c9343f }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Login</h1>
      <p class="lead">Welcome back! Please login to your account.</p>

      <!-- flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% set category, message = messages[-1] %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endif %}
      {% endwith %}

      <form id="loginForm" action="{{ url_for('login') }}" method="POST" novalidate>
        <label for="username">Username or Email</label>
        <input id="username" name="username" type="text" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>

        <button id="loginBtn" class="btn" type="submit">Login</button>
      </form>

      <div class="small-line">
        New user?
        <a href="{{ url_for('register') }}">Create an account</a>
      </div>

      <div class="small-line" style="margin-top:6px;">
        <a href="{{ forgot_password_url }}">Forgot password?</a>
      </div>
    </div>
  </div>

<script>
  // small JS to improve UX: disable button while submitting, keyboard accessibility
  (function(){
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    loginForm.addEventListener('submit', function(e){
      // basic client-side check
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if(!u || !p){
        e.preventDefault();
        alert('Please enter username and password');
        return;
      }
      // prevent double submit
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';
    });

    // re-enable button if user changes inputs
    ['username','password'].forEach(id=>{
      document.getElementById(id).addEventListener('input', ()=>{
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      });
    });

    // allow Enter key to trigger submit from inputs
    ['username','password'].forEach(id=>{
      document.getElementById(id).addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){ loginForm.requestSubmit(); }
      });
    });
  })();
</script>
</body>
</html>
